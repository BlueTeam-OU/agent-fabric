# REUSE (https://reuse.software, spec 3.3) — one license for the whole
# repository: Apache-2.0. A managed project's knowledge lives in the
# project's own repository under its own license (<working copy>/
# .agent-fabric/memory/), never here; projects/<id>/ here holds a project's
# binding and integration material, which the license holder placed under
# this repository's license on 2026-09-14. projects/registry.json records
# each project's OWN license as information about that project's tree.
version = 1
SPDX-PackageName = "agent-fabric"
SPDX-PackageSupplier = "Andrea Benetton"
SPDX-PackageDownloadLocation = "https://github.com/BlueTeam-OU/agent-fabric"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Andrea Benetton"
SPDX-License-Identifier = "Apache-2.0"

# Vendored, unchanged: Anthropic's skill-creator skill. Upstream
# https://github.com/anthropics/skills, path skills/skill-creator, commit
# dbd4588f9e1033efb41dad4bef2f7947c8993d44 (its LICENSE.txt is Apache-2.0).
# The README beside it is ours and falls under the aggregate annotation.
[[annotations]]
path = ["policies/skill-creator/**"]
precedence = "override"
SPDX-FileCopyrightText = "Anthropic, PBC"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileContributor = "https://github.com/anthropics/skills/tree/dbd4588f9e1033efb41dad4bef2f7947c8993d44/skills/skill-creator"

[[annotations]]
path = ["policies/skill-creator/README.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Andrea Benetton"
SPDX-License-Identifier = "Apache-2.0"
