name: stripped-nightly

# Every test file run on a copy of the tree without its instance data
# (tests/stripped_run.py, agent-fabric ADR-045 rule 3). The scan in
# tests/test_tests_read_fixtures.py reads test source and cannot see a test
# that reaches the live data through a tool it runs; this run can, and is
# too slow for every push (270 files, one after another in one stripped
# copy and one TMPDIR, so a file sees what an earlier one left). It fails on a
# red file not in tests/stripped_skip.txt and on a listed file that now
# passes, so the list only shrinks. On a pull request it runs only when the
# run's own parts change, so a list edit is proven before it lands.
#
# The AlmaLinux 10 platform leg (fabric-h2's platform) runs here too, not in
# ci.yml: it made every PR's CI 6 minutes longer (16 -> 22 min median on main,
# 2026-11-04..11-12) and the owner put it nightly on 2026-11-12. It is outside
# ci-ok, so an EL 10 break merges green. scheduled-red reads this run at 17:00
# UTC (runtime/control/) and files one job per workflow: while a job for either
# job's red is open, the other's red files nothing (python-dev-02's j176 scopes
# it per job). A branch that changes the profile can run the leg first:
# gh workflow run stripped-nightly.yml --ref <branch>.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - tests/stripped_run.py
      - tests/stripped_skip.txt
      - .github/workflows/stripped-nightly.yml

permissions:
  contents: read

concurrency:
  group: stripped-nightly-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  stripped:
    runs-on: ubuntu-latest
    # A cap for a hang, not a budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The copy's objects hold the tree's history: a port's test reads
          # the old script from it (tests/stripped_run.py).
          fetch-depth: 0
      - name: the fleet's pinned Python, as a host installs it
        run: sudo /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # paperkey as ci.yml installs it: retried fetches, one index refresh (j772).
      - name: the schema validator and paperkey, as the suites' environment has them
        run: |
          python3 -m pip install --quiet --disable-pip-version-check jsonschema
          apt_get() { sudo apt-get -o Acquire::Retries=5 "$@"; }
          apt_get install -y --no-install-recommends paperkey || { apt_get update && apt_get install -y --no-install-recommends paperkey; }
      # A short TMPDIR: the copy and each file's TMPDIR live under it, and a
      # long one overflows an AF_UNIX socket path (test_bootstrap_internals,
      # python-dev-03's run of 2026-10-19).
      - name: every test file on a stripped copy
        env:
          TMPDIR: /tmp/sr
        run: mkdir -p "$TMPDIR" && python3 tests/stripped_run.py . --skip-list tests/stripped_skip.txt tests/test_*.py

  # ci.yml's platform-smoke steps for one platform; a change there is made here too.
  platform-almalinux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # AlmaLinux 10 (fabric-h2): gh, ShellCheck and minisign are in EPEL; a minimal
    # image has coreutils-single, which coreutils replaces only with --allowerasing.
    container: almalinux:10
    # ci.yml's cap for the same steps: a hang, not a budget.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      INSTALL: dnf install -y --allowerasing --setopt=install_weak_deps=False
    steps:
      - name: the host contract, from the profile's own package map
        run: |
          set -e
          $INSTALL bash git ca-certificates   # enough to check out and read the map
          dnf install -y epel-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install what the profile names, and the static-check tools
        run: |
          set -e
          pkgs="$(bash runtime/provisioning/platform/packages.sh almalinux | tr '\n' ' ')"
          echo "installing: $pkgs"
          $INSTALL $pkgs ShellCheck python3-pip hostname minisign bubblewrap
          pipi="python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore"
          $pipi --break-system-packages ruff==0.16.7 jsonschema || $pipi ruff==0.16.7 jsonschema
      - name: the fleet's pinned Python, as a host installs it (as root, before the unprivileged login)
        run: /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      - name: every tool of the contract answers
        run: |
          set -e
          . runtime/provisioning/platform/detect.sh
          [ "$PLATFORM_ID" = almalinux ] || { echo "detected $PLATFORM_ID, expected almalinux"; exit 1; }
          # A tool the platform packages nowhere (PLATFORM_NO_PACKAGE: paperkey) is installed by hand, so not here.
          for t in "${FABRIC_HOST_TOOLS[@]}"; do
            for skip in "${PLATFORM_NO_PACKAGE[@]}"; do [ "$t" = "$skip" ] && continue 2; done
            command -v "$t" >/dev/null || { echo "missing after install: $t"; exit 1; }
          done
          # ADR-040 §5 rule 1 (A 2026-11-11): EL 10's python3 (3.12) is below the
          # floor and runs python_pin.py only, which the step before this one did.
          echo "host $(python3 -V) bootstraps the pin only"
      - name: the suites, as an unprivileged login (a host never runs the fabric as root)
        run: |
          set -e
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          # The fabric runs on the pin, as on fabric-h2, not on the platform's
          # python3 (review F8). Set inside the command: su resets PATH.
          mkdir -p /usr/local/lib/ci-pin-bin
          ln -sf /usr/local/bin/fabric-python /usr/local/lib/ci-pin-bin/python3
          on_pin="export PATH=/usr/local/lib/ci-pin-bin:\$PATH && python3 -V && "
          first=""; last=""
          if [ "${{ matrix.shard }}" = 1 ]; then first="bash tests/run.sh static && "; last=" && bash tests/run.sh bash"; fi
          su ci -c "${on_pin}cd '$GITHUB_WORKSPACE' && ${first}AGENT_FABRIC_TEST_SHARD='${{ matrix.shard }}/3' bash tests/run.sh python${last}"
