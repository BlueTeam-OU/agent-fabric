name: disarm-on-push

# A pull request is armed on a head the review class reviewed (ADR-019
# rules 4-6), and auto-merge then merges whatever head is there once the
# checks pass: a push after the arming (a fold, a conflict merge, a late
# fix) would land unreviewed. GitHub keeps auto-merge across a push from
# anyone with write access, so this job takes it off and says why; the
# arming is done again on the new head, through arm.sh, once it is
# reviewed. Seen live on #134 (2026-10-09): a conflict merge with new
# code sat armed until it was disarmed by hand.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: disarm-on-push-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disarm:
    # A fork's or Dependabot's pull request runs with a read-only token and
    # is not armed by a session; the job is skipped there, never red.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Take auto-merge off a pull request whose head moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PUSHED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          # Read now, not from the event, and compared with the push: an
          # arming made after the push is an arming of the new head and
          # stays. Both times are GitHub's UTC "…Z" form, so they order as
          # strings.
          read -r node armed_on < <(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id autoMergeRequest{enabledAt}}}}' \
            -f o="${GH_REPO%/*}" -f r="${GH_REPO#*/}" -F n="$PR" \
            --jq '.data.repository.pullRequest | "\(.id) \(.autoMergeRequest.enabledAt // "-")"')
          if [[ "$armed_on" == "-" ]]; then
            echo "#$PR is not armed: nothing to take off"
            exit 0
          fi
          if [[ ! "$armed_on" < "$PUSHED_AT" ]]; then
            echo "#$PR was armed at $armed_on, at or after the push ($PUSHED_AT): an arming of the new head, kept"
            exit 0
          fi
          gh api graphql -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}' \
            -f id="$node" >/dev/null
          body="Auto-merge taken off: the head moved from ${BEFORE:0:8} to ${AFTER:0:8} after the arming (armed $armed_on). A pull request is armed on a reviewed head (ADR-019); review the new range, then arm again with arm.sh."
          gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "$body"
