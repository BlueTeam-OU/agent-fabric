name: disarm-on-push

# A pull request is armed on a head the review class reviewed (ADR-019
# rules 4-6), and auto-merge then merges whatever head is there once the
# checks pass: a push after the arming (a fold, a conflict merge, a late
# fix) would land unreviewed. GitHub keeps auto-merge across a push from
# anyone with write access, so this job takes it off and says why; the
# arming is done again on the new head, through fabric-pr arm, once it is
# reviewed. Seen live on #134 (2026-10-09): a conflict merge with new
# code sat armed until it was disarmed by hand.
#
# pull_request_target, not pull_request: for pull_request GitHub runs the
# PR's own copy of this file, so a push that edits, deletes or breaks it
# would leave its own arming in place. pull_request_target runs main's
# copy. That is safe here only because nothing of the pull request is
# checked out or run: the job reads the event's numbers and calls the API.
# Keep it so; a checkout of the head under this trigger would run a
# stranger's code with a write token.
on:
  pull_request_target:
    types: [synchronize]

# Auto-merge is a write to the pull request's merge, so the token needs
# contents: write as well: with pull-requests: write alone GitHub refuses
# disablePullRequestAutoMerge ("Resource not accessible by integration",
# live on #139, 2026-10-09). The job writes nothing else: one mutation and
# one comment. statuses: read is for the new head's fabric/armed status,
# the one tie of an arming to a head; a token that cannot read it ties
# nothing, and every arming would be taken off.
permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: disarm-on-push-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disarm:
    # A fork's pull request is skipped: GitHub itself takes auto-merge off
    # after a push from someone without write access, and nothing of a fork
    # is armed through the gate. A Dependabot pull request is skipped whoever
    # pushes to it: Dependabot's own action-pin bumps are merged by the
    # coordinator, not armed through the gate (ADR-018).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Take auto-merge off a pull request whose head moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          read -r node armed_on < <(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id autoMergeRequest{enabledAt}}}}' \
            -f o="${GH_REPO%/*}" -f r="${GH_REPO#*/}" -F n="$PR" \
            --jq '.data.repository.pullRequest | "\(.id) \(.autoMergeRequest.enabledAt // "-")"')
          if [[ "$armed_on" == "-" ]]; then
            echo "#$PR is not armed: nothing to take off"
            exit 0
          fi
          # Which head an arming is of is told by the head, never by a clock:
          # fabric-pr arm posts fabric/armed on the sha its gates read before
          # it enables auto-merge, so that status on AFTER is an arming of
          # AFTER. enabledAt against the event's updated_at could not tell:
          # both are whole seconds, and an arming of the old head in the
          # push's second read as the new head's (audit F02); updated_at
          # also moves with any edit of the PR. Asked of the sha, not the
          # branch, which may have moved again. A read that fails is no tie:
          # under set -e it would end the job with the arming still on.
          tie="$(gh api "repos/$GH_REPO/commits/$AFTER/status?per_page=100" \
            --jq 'first(.statuses[] | select(.context == "fabric/armed") | .state) // "-"')" || tie="-"
          if [[ "$tie" == "success" ]]; then
            echo "#$PR was armed at $armed_on and ${AFTER:0:8} carries fabric/armed: an arming of the new head, kept"
            exit 0
          fi
          gh api graphql -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}' \
            -f id="$node" >/dev/null
          body="Auto-merge taken off: the head moved from ${BEFORE:0:8} to ${AFTER:0:8}, and the arming (armed $armed_on) is not one of ${AFTER:0:8}, which carries no fabric/armed status. A pull request is armed on a reviewed head (ADR-019); review the new range, then arm again with fabric-pr arm."
          gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$body" >/dev/null
          echo "$body"
