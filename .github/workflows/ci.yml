name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# The token every job gets: read the repository, nothing else. No job
# writes to GitHub; left unset, it would be the repository's default.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes: nobody reads
# a verdict on a head that is no longer the PR's. Only pull requests: a
# push to main and a queue run are each the last word on their commit, so
# each gets a group of its own (its run id) — a shared group, even without
# cancel-in-progress, keeps one pending run and cancels the one before it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    # Every bash script parses, shellcheck at error severity, ruff on the
    # rule set in ruff.toml — before any suite, on one interpreter.
    runs-on: ubuntu-latest
    # Measured ~30 s. A job without a cap runs to GitHub's six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y --no-install-recommends shellcheck && python3 -m pip install --quiet --disable-pip-version-check ruff==0.16.7
      - run: bash tests/static.sh

  reuse:
    # The repository stays REUSE 3.3 compliant: a file whose own SPDX header
    # names a licence missing from LICENSES/, or a LICENSES/ text no file
    # uses, fails here. A foreign file with no header is still Apache-2.0 by
    # REUSE.toml's "**" annotation and passes: that is a review's to catch.
    # reuse pinned by version, as ruff is above; ci-ok needs it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --quiet --disable-pip-version-check reuse==6.2.0
      - run: reuse lint

  guards-and-suites:
    # The bash suites and the guards on the oldest and newest interpreters.
    # The Python suites are not here: they run once per interpreter an agent
    # host runs (3.13, Debian 13's system python3; 3.14, Fedora's; ADR-040
    # rule 1) in platform-smoke, whose containers are those two platforms.
    # They ran in this job's matrix as well, the same suites on the same
    # two interpreters twice a push (audit of 2026-10-11). Static checks are
    # their own job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two legs (the owner, 2026-10-09): every interpreter a host runs is
          # 3.13 or 3.14. The bash suites run on the oldest interpreters the hosts promise
          # and on the newest (review of #68: the newest alone lost the oldest
          # and Node 20). The shims of ported scripts run the pinned fabric-python
          # whatever this matrix sets up (ADR-040 rule 4, installed below);
          # what the matrix decides here is the python3 of the scripts that
          # keep the host's (the git and Claude Code hooks, bootstrap).
          - { python: '3.13', node: '20' }
          - { python: '3.14', node: '22' }
    # The bash section takes under a minute (2026-10-11); the cap is for a
    # hang, not a budget, so it sits well above the slowest healthy run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the attribution and authority guards enumerate
          # the commits a branch adds over its base and refuse to guess a range.
          fetch-depth: 0
      # After move-plan step D main keeps no operator tree, and the authority
      # guards read the fabric's authority.json from the operator
      # repository's main instead (contributors.fabric_authority; ADR-045
      # rule 7, docs/split/move-plan.md precondition 6). Its checkout comes
      # through a read-only deploy key (move-plan §5 Q2). While main has the
      # tree (operator/, or the pre-move policies/authority.json) the probe
      # says so and nothing is checked out. Past step D an empty key FAILS:
      # a guard with nothing to read refuses anyway, and a step that skipped
      # would leave only that refusal to say why. Dependabot's runs receive
      # no Actions secrets: past step D its pull requests need
      # OPERATOR_DEPLOY_KEY as a Dependabot secret too.
      #
      # The operator repository is private and this one's logs are public:
      # its checkout is main alone at depth 1, exported to no later step,
      # and removed by the authority step that reads it, however that step
      # ends, before any of the branch's code runs in this job (review of
      # #717, F1). The later suites run the branch's own copy of the guards
      # with no operator: there AGENT_FABRIC_AUTHORITY_GATED_ELSEWHERE says
      # the authority step is the gate (tests/run.py).
      - name: the operator's main, once main keeps no operator tree (move-plan step D)
        id: operator
        env:
          OPERATOR_DEPLOY_KEY: ${{ secrets.OPERATOR_DEPLOY_KEY }}
        run: |
          if git cat-file -e origin/main:operator 2>/dev/null || git cat-file -e origin/main:policies/authority.json 2>/dev/null; then
            echo "origin/main keeps the operator tree: the guards read it there"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$OPERATOR_DEPLOY_KEY" ]; then
            echo "::error::origin/main keeps no operator tree, so the authority guards read BlueTeam-OU/blueteam-fabric's main, and the secret OPERATOR_DEPLOY_KEY (its read-only deploy key) is empty here; a Dependabot run needs it as a Dependabot secret"
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.operator.outputs.needed == 'true'
        with:
          repository: BlueTeam-OU/blueteam-fabric
          ref: main
          ssh-key: ${{ secrets.OPERATOR_DEPLOY_KEY }}
          # main's tip alone: the guards read one blob there, and no other branch or past commit is fetched.
          fetch-depth: 1
          persist-credentials: false
          # checkout writes only under the workspace; the authority step moves it out, so no guard sees it in this tree.
          path: .operator-main
      # The branch's authority, judged by MAIN's copy of the guards, as
      # the first step after the checkout: before any of the branch's code
      # runs in this job (a later `python3 -m pip` puts the checkout first
      # on sys.path; second re-review of #75). A contributor's
      # entry admits tools/ and tests/ (agent-fabric ADR-018 §5 rule 8):
      # run from the branch, a module it added beside the guards shadows a
      # stdlib name they import, and a sourced test helper runs first and
      # can rewrite them (re-review of #75). -I: no script directory, no
      # user site, no PYTHON* variables; the guards then find their own
      # modules beside main's copy, and judge this checkout.
      #
      # Where main keeps the operator's files is asked of main's own roots
      # (docs/split/move-plan.md §2 precondition 5): `git archive` stores a
      # symlink shim and not its target, and the branch's roots would name
      # a layout main has not got yet. The prefix is the one
      # AGENT_FABRIC_OPERATOR names under the checkout; unset it is
      # "operator/", where operator_root() falls back. Until step B is on
      # main the prefix is "" (the pre-move layout); `moved` is read from
      # main's roots, so it follows whichever layout main has. Past step D
      # main's roots still names operator/policies/authority.json, which
      # main lacks, and `git archive` refuses a path it lacks: only the
      # paths main has are archived (the guards then read the operator's
      # file through git, never from $base).
      #
      # The operator's checkout, when there is one, is named to the two
      # guards alone, at the commit checked out (main's tip), and removed on
      # the step's exit, failure included.
      - name: the branch's authority, judged by main's own guards
        env:
          OPERATOR_NEEDED: ${{ steps.operator.outputs.needed }}
        run: |
          op="$RUNNER_TEMP/operator-main"
          trap 'rm -rf "$op" "$GITHUB_WORKSPACE/.operator-main"' EXIT
          operator=()
          if [ "$OPERATOR_NEEDED" = true ]; then
            mv .operator-main "$op"
            operator=("AGENT_FABRIC_OPERATOR_GIT=$op" "AGENT_FABRIC_OPERATOR_REF=$(git -C "$op" rev-parse --verify HEAD)")
          fi
          base="$(mktemp -d)"
          git archive origin/main tools/fabric | tar -x -C "$base"
          moved="$(/usr/bin/python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); import roots; print("\n".join(roots.git_path(*p.split("/"), base=sys.argv[2]) for p in sys.argv[3:]))' "$base/tools/fabric" "$PWD" policies/authority.json)"
          kept=()
          for p in policies $moved; do
            if git cat-file -e "origin/main:$p" 2>/dev/null; then kept+=("$p"); fi
          done
          if [ "${#kept[@]}" -gt 0 ]; then git archive origin/main "${kept[@]}" | tar -x -C "$base"; fi
          env "${operator[@]}" AGENT_FABRIC_CHARTER_BASE=origin/main /usr/bin/python3 -I "$base/tools/fabric/guards/agent_fabric_dir_authority.py"
          env "${operator[@]}" AGENT_FABRIC_CHARTER_BASE=origin/main /usr/bin/python3 -I "$base/tools/fabric/guards/charter_authority.py" "$PWD"
      # Should the authority step never have started (a cancel between the
      # two), the checkout is still removed before anything else runs.
      - name: no copy of the operator outlives the authority step
        if: always()
        run: rm -rf "$RUNNER_TEMP/operator-main" "$GITHUB_WORKSPACE/.operator-main"
      # The fleet's pinned Python (runtime/python.json), installed as a host
      # installs it: every shim runs /usr/local/bin/fabric-python, and the
      # suites strip AGENT_FABRIC_*, so no override would reach them.
      - name: the fleet's pinned Python, as a host installs it
        run: sudo /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      # Node in every leg, as the suites' environment has it: the two suites
      # that call node as an oracle (tests/test_control_js.py,
      # tests/test_control_sessions.py) are Python suites and run in
      # platform-smoke now. The bash section does not need it, nor the
      # jsonschema and paperkey steps below (also for Python suites): kept
      # until the legs are shown to pass without them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: the schema validator lint prefers (its structural fallback covers a clean machine)
        run: python3 -m pip install --quiet --disable-pip-version-check jsonschema
      # A host tool the fabric requires (platform/detect.sh FABRIC_HOST_TOOLS):
      # the store's suite makes a real recovery copy with it, and fails
      # where it is missing rather than skip the case. The image's package
      # index ages and the archive's name sometimes does not resolve (j772,
      # 2026-11-11): each fetch retries, and a failed install refreshes the
      # index once before its second try.
      - name: paperkey, for the recovery copy the store's suite makes
        run: |
          apt_get() { sudo apt-get -o Acquire::Retries=5 "$@"; }
          apt_get install -y --no-install-recommends paperkey || { apt_get update && apt_get install -y --no-install-recommends paperkey; }
      - name: no machine attribution in commits or the PR description
        run: python3 tools/fabric/guards/ban_generated_by_attribution.py
      # agent-fabric ADR-019 §5 rule 4 (A 2026-11-24): past commits.refuse_over a
      # commit that adds work carries an Owner-Word: trailer; judged against the
      # fleet's value at the PR's base, since this token reads no settings repository.
      - name: the branch's size (Owner-Word past commits.refuse_over)
        run: python3 tools/fabric/guards/branch_size.py ci
      # agent-fabric ADR-057 §5 rule 5: a commit's timestamp proof is a note,
      # which no checkout fetches. A remote without the ref yet is said and
      # passed on: the checker refuses a missing proof itself, once the
      # repository's `since` is set.
      - name: the timestamp proofs (refs/notes/fabric-ots)
        run: git fetch --no-tags origin '+refs/notes/fabric-ots:refs/notes/fabric-ots' || echo "no refs/notes/fabric-ots on origin"
      # The checker and what it judges by (the agent keys, the lineage, the
      # role holders and locales, policies/signing.json, the registry) are
      # main's, as for the authority step above: from the branch, a key, a
      # holder or a null `since` it added would admit its own commits.
      - name: every commit the branch adds is signed, by its own agent once cut over (main's checker and data)
        run: |
          base="$(mktemp -d)"
          git archive origin/main tools/fabric | tar -x -C "$base"
          moved="$(/usr/bin/python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); import roots; print("\n".join(roots.git_path(*p.split("/"), base=sys.argv[2]) for p in sys.argv[3:]))' "$base/tools/fabric" "$PWD" policies/signing.json policies/authority.json identities/keys identities/roles projects/registry.json)"
          prefix="$(/usr/bin/python3 -I -c 'import sys; sys.path.insert(0, sys.argv[1]); import roots; print(roots.operator_prefix(sys.argv[2]))' "$base/tools/fabric" "$PWD")"
          # The forge keys are archived as a folder beside signing.json, under main's
          # prefix: main's git_path does not know the folder until step B is on main.
          # TODO(move-plan step D, j1119): main keeps no keys, holders or registry then; archive them from the
          # operator's main at its own paths. No checkout is left for this step: it fetches its own copy as the
          # authority step does (main alone, depth 1, removed on exit), and moves to before the first step that runs
          # the branch's code, so none of that code can read or write the operator's data.
          git archive origin/main policies "${prefix}policies/forge-keys" $moved | tar -x -C "$base"
          AGENT_FABRIC_OPERATOR="$base/$prefix" /usr/bin/python3 -I "$base/tools/fabric/guards/ban_unsigned_commits.py"
      # The branch's own authority guards run here with no operator: past step D they refuse with exit 4, and the
      # authority step above is this job's gate (tests/run.py, AGENT_FABRIC_AUTHORITY_GATED_ELSEWHERE).
      - name: the bash suites
        env:
          AGENT_FABRIC_AUTHORITY_GATED_ELSEWHERE: "1"
        run: bash tests/run.sh bash

  platform-smoke:
    # The platform profiles are proven by being used: each container
    # installs the fabric's host contract from runtime/provisioning/
    # platform/packages.sh for its platform and runs the suites there.
    # (The Fedora container is plain Fedora — the Qubes profile differs
    # from it only in where a package persists and who holds sudo.)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # platform and shard are the matrix's own keys, so it is their product, 2 x 3 = 6 jobs; each `include` entry below names
        # its platform, which equals that key's value in three of the six combinations and so is added to those three and
        # to no others. Were platform only in `include`, each entry would be added to all three shard combinations and the
        # next entry would overwrite the platform the last had added (added values may be overwritten, original ones not):
        # three jobs, all debian.
        # AlmaLinux 10 is not here: it runs nightly, outside ci-ok (stripped-nightly.yml, the owner, 2026-11-12).
        platform: [fedora, debian]
        # The python section is split in three on every platform (AGENT_FABRIC_TEST_SHARD, tests/run_python_suites.py): each
        # platform still runs every suite, in a third of the time per job (the owner, 2026-11-13).
        shard: [1, 2, 3]
        include:
          # minisign and bubblewrap are not host tools: they let the suites' cross-check against the minisign program
          # (test_control_carrier_install AgainstMinisign) and the review sandbox's cases (test_review_mcp) run instead of
          # skipping; bwrap may still be refused user namespaces in a container, which those cases probe and skip on (j830).
          - platform: fedora
            image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False
            extra: ShellCheck python3-pip hostname minisign bubblewrap
          - platform: debian
            image: debian:stable-slim
            install: apt-get install -y --no-install-recommends
            extra: shellcheck python3-pip ca-certificates hostname minisign bubblewrap
    container: ${{ matrix.image }}
    # Measured 7-8.5 min on 2026-09-29, 20-24 min on 2026-10-11 (Fedora cancelled at 25 on #194 and #197);
    # the cap is for a hang, not a budget, so it sits well above the slowest healthy run.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # a container's default `sh` is dash on Debian; the profiles are bash
    steps:
      - name: the host contract, from the profile's own package map
        run: |
          set -e
          if command -v apt-get >/dev/null; then apt-get update; fi
          ${{ matrix.install }} bash git ca-certificates   # enough to check out and read the map
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install what the profile names, and the static-check tools
        run: |
          set -e
          pkgs="$(bash runtime/provisioning/platform/packages.sh ${{ matrix.platform }} | tr '\n' ' ')"
          echo "installing: $pkgs"
          ${{ matrix.install }} $pkgs ${{ matrix.extra }}
          # Root in a throwaway container is the point of this step, so pip's
          # root-user warning is answered, not fixed (fabric-ci-warnings, j542).
          pipi="python3 -m pip install --quiet --disable-pip-version-check --root-user-action=ignore"
          $pipi --break-system-packages ruff==0.16.7 jsonschema || $pipi ruff==0.16.7 jsonschema
      - name: the fleet's pinned Python, as a host installs it (as root, before the unprivileged login)
        run: /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      - name: every tool of the contract answers
        run: |
          set -e
          . runtime/provisioning/platform/detect.sh
          [ "$PLATFORM_ID" = "${{ matrix.platform }}" ] || { echo "detected $PLATFORM_ID, expected ${{ matrix.platform }}"; exit 1; }
          # A tool the platform packages nowhere (PLATFORM_NO_PACKAGE) is installed by hand, so not here.
          for t in "${FABRIC_HOST_TOOLS[@]}"; do
            for skip in "${PLATFORM_NO_PACKAGE[@]}"; do [ "$t" = "$skip" ] && continue 2; done
            command -v "$t" >/dev/null || { echo "missing after install: $t"; exit 1; }
          done
          host_python_ok || { echo "the platform's python3 is older than $FABRIC_HOST_PYTHON_MIN"; exit 1; }
      - name: the suites, as an unprivileged login (a host never runs the fabric as root)
        run: |
          set -e
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          # Static and bash sections are the platform's, not the python section's, and every shard would repeat them: shard 1 runs them.
          # This job is handed no operator: past move-plan step D the authority guards' gate is guards-and-suites' authority step.
          first=""; last=""
          if [ "${{ matrix.shard }}" = 1 ]; then first="bash tests/run.sh static && "; last=" && AGENT_FABRIC_AUTHORITY_GATED_ELSEWHERE=1 bash tests/run.sh bash"; fi
          # The python step's per-suite times, for refreshing tests/suite_durations.json; in the workspace, which is ci's.
          su ci -c "cd '$GITHUB_WORKSPACE' && ${first}AGENT_FABRIC_TEST_DURATIONS='$GITHUB_WORKSPACE/suite-durations.json' AGENT_FABRIC_TEST_SHARD='${{ matrix.shard }}/3' bash tests/run.sh python${last}"
      - name: per-suite durations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One name per job: six uploads of one name collide.
          name: suite-durations-${{ matrix.platform }}-${{ matrix.shard }}
          path: suite-durations.json
          if-no-files-found: ignore

  ci-ok:
    # The one check the ruleset on main requires
    # (tools/fabric/github-ruleset-main.json). A matrix leg's check name
    # carries its matrix values and GitHub cuts it past a length, so
    # requiring the legs by name broke whenever the matrix changed: this
    # job stands for all of them. always(): a needed job that failed or was
    # cancelled must make this one fail, not skip it (a skipped required
    # check reads as passing).
    if: always()
    needs: [static, reuse, guards-and-suites, platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "ci-ok: a needed job ended $r (all: $RESULTS)"; exit 1; }
          done
          echo "ci-ok: $RESULTS"
