name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# The token every job gets: read the repository, nothing else. No job
# writes to GitHub; left unset, it would be the repository's default.
permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes: nobody reads
# a verdict on a head that is no longer the PR's. Only pull requests: a
# push to main and a queue run are each the last word on their commit, so
# each gets a group of its own (its run id) — a shared group, even without
# cancel-in-progress, keeps one pending run and cancels the one before it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    # Every bash script parses, shellcheck at error severity, ruff on the
    # rule set in ruff.toml — before any suite, on one interpreter.
    runs-on: ubuntu-latest
    # Measured ~30 s. A job without a cap runs to GitHub's six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: sudo apt-get install -y --no-install-recommends shellcheck && python3 -m pip install --quiet --disable-pip-version-check ruff==0.16.7
      - run: bash tests/static.sh

  guards-and-suites:
    # The bash suites and the guards on the oldest and newest interpreters.
    # The Python suites are not here: they run once per interpreter an agent
    # host runs (3.13, Debian 13's system python3; 3.14, Fedora's; ADR-040
    # rule 1) in platform-smoke, whose containers are those two platforms.
    # They ran in this job's matrix as well, the same suites on the same
    # two interpreters twice a push (audit of 2026-10-11). Static checks are
    # their own job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two legs (the owner, 2026-10-09): every interpreter a host runs is
          # 3.13 or 3.14. The bash suites run on the oldest interpreters the hosts promise
          # and on the newest (review of #68: the newest alone lost the oldest
          # and Node 20). The shims of ported scripts run the pinned fabric-python
          # whatever this matrix sets up (ADR-040 rule 4, installed below);
          # what the matrix decides here is the python3 of the scripts that
          # keep the host's (the git and Claude Code hooks, bootstrap).
          - { python: '3.13', node: '20' }
          - { python: '3.14', node: '22' }
    # The bash section takes under a minute (2026-10-11); the cap is for a
    # hang, not a budget, so it sits well above the slowest healthy run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the attribution and authority guards enumerate
          # the commits a branch adds over its base and refuse to guess a range.
          fetch-depth: 0
      # The branch's authority, judged by MAIN's copy of the guards, as
      # the first step after the checkout: before any of the branch's code
      # runs in this job (a later `python3 -m pip` puts the checkout first
      # on sys.path; second re-review of #75). A contributor's
      # entry admits tools/ and tests/ (agent-fabric ADR-018 §5 rule 8):
      # run from the branch, a module it added beside the guards shadows a
      # stdlib name they import, and a sourced test helper runs first and
      # can rewrite them (re-review of #75). -I: no script directory, no
      # user site, no PYTHON* variables; the guards then find their own
      # modules beside main's copy, and judge this checkout.
      - name: the branch's authority, judged by main's own guards
        run: |
          base="$(mktemp -d)"
          git archive origin/main tools/fabric policies | tar -x -C "$base"
          AGENT_FABRIC_CHARTER_BASE=origin/main /usr/bin/python3 -I "$base/tools/fabric/guards/agent_fabric_dir_authority.py"
          AGENT_FABRIC_CHARTER_BASE=origin/main /usr/bin/python3 -I "$base/tools/fabric/guards/charter_authority.py" "$PWD"
      # The fleet's pinned Python (runtime/python.json), installed as a host
      # installs it: every shim runs /usr/local/bin/fabric-python, and the
      # suites strip AGENT_FABRIC_*, so no override would reach them.
      - name: the fleet's pinned Python, as a host installs it
        run: sudo /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      # Node in every leg, as the suites' environment has it: the two suites
      # that run the Node control plane as an oracle (tests/test_control_js.py,
      # tests/test_control_sessions.py) are Python suites and run in
      # platform-smoke now. The bash section does not need it, nor the
      # jsonschema and paperkey steps below (also for Python suites): kept
      # until the legs are shown to pass without them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: the schema validator lint prefers (its structural fallback covers a clean machine)
        run: python3 -m pip install --quiet --disable-pip-version-check jsonschema
      # A host tool the fabric requires (platform/detect.sh FABRIC_HOST_TOOLS):
      # the store's suite makes a real recovery copy with it, and fails
      # where it is missing rather than skip the case.
      - name: paperkey, for the recovery copy the store's suite makes
        run: sudo apt-get install -y --no-install-recommends paperkey
      - name: no machine attribution in commits or the PR description
        run: python3 tools/fabric/guards/ban_generated_by_attribution.py
      - name: every commit the branch adds is signed
        run: python3 tools/fabric/guards/ban_unsigned_commits.py
      - name: the bash suites
        run: bash tests/run.sh bash

  platform-smoke:
    # The platform profiles are proven by being used: each container
    # installs the fabric's host contract from runtime/provisioning/
    # platform/packages.sh for its platform and runs the suites there.
    # (The Fedora container is plain Fedora — the Qubes profile differs
    # from it only in where a package persists and who holds sudo.)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: fedora
            image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False
            extra: ShellCheck python3-pip hostname
          - platform: debian
            image: debian:stable-slim
            install: apt-get install -y --no-install-recommends
            extra: shellcheck python3-pip ca-certificates hostname
    container: ${{ matrix.image }}
    # Measured 7-8.5 min on 2026-09-29, 20-24 min on 2026-10-11 (Fedora cancelled at 25 on #194 and #197);
    # the cap is for a hang, not a budget, so it sits well above the slowest healthy run.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # a container's default `sh` is dash on Debian; the profiles are bash
    steps:
      - name: the host contract, from the profile's own package map
        run: |
          set -e
          if command -v apt-get >/dev/null; then apt-get update; fi
          ${{ matrix.install }} bash git ca-certificates   # enough to check out and read the map
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install what the profile names, and the static-check tools
        run: |
          set -e
          pkgs="$(bash runtime/provisioning/platform/packages.sh ${{ matrix.platform }} | tr '\n' ' ')"
          echo "installing: $pkgs"
          ${{ matrix.install }} $pkgs ${{ matrix.extra }}
          python3 -m pip install --quiet --disable-pip-version-check --break-system-packages ruff==0.16.7 jsonschema || python3 -m pip install --quiet --disable-pip-version-check ruff==0.16.7 jsonschema
      - name: the fleet's pinned Python, as a host installs it (as root, before the unprivileged login)
        run: /usr/bin/python3 tools/fabric/python_pin.py install && /usr/bin/python3 tools/fabric/python_pin.py check
      - name: every tool of the contract answers
        run: |
          set -e
          . runtime/provisioning/platform/detect.sh
          [ "$PLATFORM_ID" = "${{ matrix.platform }}" ] || { echo "detected $PLATFORM_ID, expected ${{ matrix.platform }}"; exit 1; }
          for t in "${FABRIC_HOST_TOOLS[@]}"; do command -v "$t" >/dev/null || { echo "missing after install: $t"; exit 1; }; done
          host_python_ok || { echo "the platform's python3 is older than $FABRIC_HOST_PYTHON_MIN"; exit 1; }
      - name: the suites, as an unprivileged login (a host never runs the fabric as root)
        run: |
          set -e
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && bash tests/run.sh static && bash tests/run.sh python && bash tests/run.sh bash"

  ci-ok:
    # The one check the ruleset on main requires
    # (tools/fabric/github-ruleset-main.json). A matrix leg's check name
    # carries its matrix values and GitHub cuts it past a length, so
    # requiring the legs by name broke whenever the matrix changed: this
    # job stands for all of them. always(): a needed job that failed or was
    # cancelled must make this one fail, not skip it (a skipped required
    # check reads as passing).
    if: always()
    needs: [static, guards-and-suites, platform-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "ci-ok: a needed job ended $r (all: $RESULTS)"; exit 1; }
          done
          echo "ci-ok: $RESULTS"
