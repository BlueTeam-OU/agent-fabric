# agent-fabric: the host-wide lease directory (bin/fabric-lease,
# ADR-010). Installed to /etc/tmpfiles.d/agent-fabric.conf by
# runtime/provisioning/persist-accounts.sh on a platform whose /etc
# persists; on a Qubes AppVM the boot script platform/qubes/
# agent-fabric-accounts.rc makes the same directory instead.
d /run/lock/agent-fabric 1777 root root -
